services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE}
    env_file:
      - ../../.env
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE}
    restart: unless-stopped

  admin:
    image: ${ADMIN_IMAGE:?set ADMIN_IMAGE}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/app.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped
